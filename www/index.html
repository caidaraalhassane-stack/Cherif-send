<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cherif Send</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f6fa;
 color:#172033;
 text-align:center
}
header{
 background:#1769e0;
 color:white;
 padding:30px 15px;
 border-radius:0 0 30px 30px
}
.logo{font-size:50px}
h1{margin:5px 0}
.container{padding:20px}
.card{
 background:white;
 padding:25px;
 margin:18px auto;
 max-width:500px;
 border-radius:22px;
 box-shadow:0 5px 20px #0001
}
button{
 width:100%;
 padding:16px;
 margin:8px 0;
 border:0;
 border-radius:15px;
 background:#1769e0;
 color:white;
 font-size:18px;
 font-weight:bold
}
input[type=file]{
 width:100%;
 padding:12px;
 margin:12px 0
}
.hidden{display:none}
#qrcode{margin:20px auto}
#reader{width:100%;margin:auto}
#status{
 margin-top:15px;
 font-weight:bold
}
.progress{
 width:100%;
 height:15px;
 background:#ddd;
 border-radius:10px;
 overflow:hidden
}
#bar{
 width:0%;
 height:100%;
 background:#1769e0
}
</style>
</head>

<body>

<header>
<div class="logo">📲</div>
<h1>Cherif Send</h1>
<p>Transfert rapide de fichiers</p>
</header>

<div class="container">

<div class="card">
<h2>📤 Envoyer</h2>

<input type="file" id="file">

<button onclick="startSender()">
📤 Créer le code de transfert
</button>

<div id="sender" class="hidden">
<h3>📱 Fais scanner ce QR code</h3>

<div id="qrcode"></div>

<p>Code :</p>
<h2 id="peerCode"></h2>

<p id="sendStatus">En attente du téléphone...</p>

<div class="progress">
<div id="bar"></div>
</div>
</div>
</div>


<div class="card">
<h2>📥 Recevoir</h2>

<button onclick="startReceiver()">
📷 Scanner le QR code
</button>

<div id="receiver" class="hidden">
<div id="reader"></div>
<p id="receiveStatus">Scanne le QR du téléphone qui envoie.</p>
</div>
</div>

</div>

<script>

let peer;
let connection;
let selectedFile;

function startSender(){

 selectedFile=document.getElementById("file").files[0];

 if(!selectedFile){
   alert("Choisis d'abord un fichier.");
   return;
 }

 document.getElementById("sender").classList.remove("hidden");

 peer=new Peer();

 peer.on("open",id=>{

   document.getElementById("peerCode").textContent=id;

   new QRCode(document.getElementById("qrcode"),{
      text:id,
      width:220,
      height:220
   });

   document.getElementById("sendStatus").textContent=
   "En attente du téléphone qui reçoit...";
 });

 peer.on("connection",conn=>{

   connection=conn;

   connection.on("open",()=>{

     document.getElementById("sendStatus").textContent=
     "📡 Téléphone connecté ! Envoi...";

     sendFile();

   });

 });

 peer.on("error",err=>{
   document.getElementById("sendStatus").textContent=
   "Erreur : "+err.message;
 });

}


function sendFile(){

 const chunkSize=16*1024;

 let offset=0;

 connection.send({
   type:"file-info",
   name:selectedFile.name,
   size:selectedFile.size,
   mime:selectedFile.type
 });

 function sendChunk(){

   if(offset>=selectedFile.size){

     connection.send({
       type:"file-end"
     });

     document.getElementById("sendStatus").textContent=
     "✅ Fichier envoyé !";

     return;
   }

   const slice=selectedFile.slice(
     offset,
     offset+chunkSize
   );

   const reader=new FileReader();

   reader.onload=e=>{

     connection.send(e.target.result);

     offset+=e.target.result.byteLength;

     let percent=
     Math.floor(offset/selectedFile.size*100);

     document.getElementById("bar").style.width=
     percent+"%";

     sendChunk();
   };

   reader.readAsArrayBuffer(slice);
 }

 sendChunk();
}


function startReceiver(){

 document.getElementById("receiver")
 .classList.remove("hidden");

 const scanner=new Html5Qrcode("reader");

 scanner.start(
   {facingMode:"environment"},
   {
     fps:10,
     qrbox:250
   },
   code=>{

     scanner.stop();

     document.getElementById("receiveStatus")
     .textContent="📡 Connexion...";

     connectToSender(code);

   },
   error=>{}
 );
}


function connectToSender(id){

 peer=new Peer();

 peer.on("open",()=>{

   connection=peer.connect(id);

   connection.on("open",()=>{

     document.getElementById("receiveStatus")
     .textContent=
     "📥 Connexion réussie ! Réception...";

   });

   connection.on("data",data=>{

     receiveData(data);

   });

 });

 peer.on("error",err=>{

   document.getElementById("receiveStatus")
   .textContent=
   "❌ Erreur : "+err.message;

 });

}


let receivedChunks=[];
let receivedSize=0;
let fileInfo=null;


function receiveData(data){

 if(data.type==="file-info"){

   fileInfo=data;

   receivedChunks=[];
   receivedSize=0;

   document.getElementById("receiveStatus")
   .textContent=
   "📥 Réception de : "+data.name;

   return;
 }

 if(data.type==="file-end"){

   const blob=new Blob(
     receivedChunks,
     {type:fileInfo.mime}
   );

   const url=URL.createObjectURL(blob);

   const link=document.createElement("a");

   link.href=url;
   link.download=fileInfo.name;

   document.body.appendChild(link);

   link.click();

   link.remove();

   document.getElementById("receiveStatus")
   .textContent=
   "✅ Fichier reçu : "+fileInfo.name;

   return;
 }

 receivedChunks.push(data);

 receivedSize+=data.byteLength;

 let percent=
 Math.floor(receivedSize/fileInfo.size*100);

 document.getElementById("receiveStatus")
 .textContent=
 "📥 Réception : "+percent+"%";
}

</script>

</body>
</html>
